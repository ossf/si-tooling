---
name: CI Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: v2/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@5403a413dee20909aad15f1ecb21377539fcc4df
        with:
          version: v2.1
          working-directory: v2
      - name: run tests
        run: make covcheck
